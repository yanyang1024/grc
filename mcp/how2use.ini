**运行总览**

- 原始 WebUI：以模块方式运行，避免相对导入报错。
- 统一前端：同时包含“原始应用”和“对话式应用”两个 Tab。
- 对话式 CLI：本地 `ollama` 推理，命令行自然语言调用工具。

**环境准备**

- 安装依赖（Windows，推荐用当前 Python）：  
  - `python -m pip install gradio gradio_client`
- 确认本地 `ollama` 服务与模型：  
  - `ollama list`（确认有 `qwen3:8b` 或你想用的模型）
  - 确保服务在 `http://localhost:11434` 运行（默认安装为服务，若未运行请手动启动）

**运行原始 WebUI**

- 在项目根目录运行模块而不是脚本：
  - `python -m server.gradio_app`
- 访问 `http://localhost:7860/`
- 为什么不能用 `python gradio_app.py`：  
  - 文件位于 `server/` 包内，并使用相对导入 `from .functions import ...`（见 `server/gradio_app.py:7`）。脚本方式运行会导致 `__package__` 为空，相对导入失败。模块方式 `-m` 会正确设置包上下文。

- 可选方式（等价）：  
  - `python -c "from server.gradio_app import main; main()"`
- 依赖的 API 名称：
  - 文本查询：`server/gradio_app.py:14` 暴露 `api_name="/text_search"`
  - 表格统计：`server/gradio_app.py:25` 暴露 `api_name="/table_stats"`
  - 折线生成：`server/gradio_app.py:38` 暴露 `api_name="/line_series"`

**运行统一前端**

- 同时包含“原始应用”和“对话式应用”两个 Tab：
  - `python -m server.unified_app`
- 访问 `http://localhost:7860/`
- 说明：
  - 原始应用 Tab 完整保留表单式控件与命名 API（同上）
  - 对话式应用 Tab 使用 MCP 引擎对话规划并通过 Gradio Client 调用后端，自动将结果渲染到“文本输出/表格输出/折线输出”（实现见 `server/unified_app.py:22`）
  - MCP 引擎与工具注册在 `mcp/engine.py:16` 和 `server/functions.py:78`

**运行对话式 CLI**

- 模块方式运行，避免路径问题：
  - `python -m chat.cli`
- 环境变量（可选）：
  - 设置使用 Gradio Client（调用命名 API 而非本地 handler）：  
    - PowerShell：`setx USE_GRADIO_CLIENT 1`
  - 切换模型：  
    - `setx MCP_MODEL qwen3:8b`
- 典型请求示例：
  - 文本汇总：`查询North区域相关`
  - 表格统计：`按区域汇总营收前5`
  - 折线生成：`给我近30天订单的日粒度折线`

**常见报错与解决**

- `ModuleNotFoundError: No module named 'gradio'`
  - 安装依赖：`python -m pip install gradio`
- 直接运行脚本报相对导入错误（例如 `ImportError: attempted relative import with no known parent package`）
  - 改用模块方式：`python -m server.gradio_app` 或 `python -m server.unified_app` 或 `python -m chat.cli`
- Gradio Client 调用失败或不可用
  - 统一前端的“对话式应用”会尝试调用本机 `http://localhost:7860` 的命名 API；请确认已经运行统一前端或原始 WebUI
  - MCP 引擎也支持回退到本地 handler（见 `mcp/engine.py:118`）
- 模型推理返回非纯 JSON
  - MCP 引擎会自动二次提示“Return only JSON”并重试（见 `mcp/engine.py:104`）

**对比建议**

- 先运行原始 WebUI：`python -m server.gradio_app`，通过控件选择参数执行。
- 再运行统一前端：`python -m server.unified_app`，用“对话式应用”Tab输入自然语言，感受从自然语言到工具选择与参数填充的链路。
- 或用 CLI：`python -m chat.cli`，对比 CLI 的自然语言调用与统一前端的可视化输出。

